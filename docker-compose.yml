# Tsumugi 个人知识库 - docker compose（后端 + 前端）
# 使用：docker compose up --build
# 说明：
# - 数据持久化：./data 挂载到容器（SQLite + Chroma + uploads）
# - 模型下载：首次启动需联网下载 embedding 模型（HF）
# - 前端 nginx 将 /api 代理到后端，浏览器直接访问 http://localhost:5173 或后端端口

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tsumugi-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/tsumugi.db
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - UPLOAD_DIR=/app/data/uploads
      - TSUMUGI_PORT=8001
    volumes:
      - ./data:/app/data
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: tsumugi-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    restart: unless-stopped
