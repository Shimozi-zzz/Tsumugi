# Tsumugi 涓汉鐭ヨ瘑搴?- docker compose锛堝悗绔?+ 鍓嶇锛?# 浣跨敤锛歞ocker compose up --build
# 璇存槑锛?# - 鏁版嵁鎸佷箙鍖栵細./data 鎸傝浇鍒板鍣紙SQLite + Chroma + uploads锛?# - 妯″瀷涓嬭浇锛氶娆″惎鍔ㄩ渶鑱旂綉涓嬭浇 embedding 妯″瀷锛圚F锛?# - 鍓嶇 nginx 灏?/api 浠ｇ悊鍒板悗绔紝娴忚鍣ㄧ洿鎺ヨ闂?http://localhost:5173 鎴栧悗绔鍙?
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tsumugi-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/tsumugi.db
      - CHROMA_PERSIST_DIRECTORY=/app/data/chroma
      - UPLOAD_DIR=/app/data/uploads
      - TSUMUGI_PORT=8001
    volumes:
      - ./data:/app/data
      # 鎸傝浇鏈満 HF 妯″瀷缂撳瓨锛岄伩鍏嶅鍣ㄥ唴閲嶆柊涓嬭浇 embedding 妯″瀷
      - ${HF_HOME_CACHE}:/root/.cache/huggingface:ro
    ports:
      - "8001:8001"
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: tsumugi-frontend
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"
    restart: unless-stopped
