# Tsumugi CI - 后端 pytest + 前端 build
# 说明：
# - 后端测试全部 mock（embedding/chroma/LLM），无需 .env、无需下载模型。
# - 前端 build 依赖 electron 作为 devDependency，但 CI 不打包，
#   用 ELECTRON_SKIP_BINARY_DOWNLOAD 跳过二进制下载以加速。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    env:
      # NLTK 3.10+ 安全钩子；CI 下 site-packages 不在 CWD，正常情况不会误判，
      # 显式设置以与本机行为保持一致。
      NLTK_DISABLE_IMPORT_SECURITY: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend build (Node)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Docker build backend
        run: docker build -t tsumugi-backend:ci .
